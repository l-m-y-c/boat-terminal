# Analyzer settings for the LMYC app. `flutter analyze` runs these in CI.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-raw-types: true

linter:
  rules:
    # A BLE notify or socket stream left running after its page closes.
    cancel_subscriptions: true
    # Futures nobody waits for hide errors. Wrap deliberate ones in unawaited().
    unawaited_futures: true
    discarded_futures: true
    avoid_slow_async_io: true
    prefer_final_locals: true
    always_declare_return_types: true
