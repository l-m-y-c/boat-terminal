name: lmyc_app
description: LMYC Boat Terminal companion app — pairing, check-in, and boat tools for Lower Mainland Yacht Club members.
publish_to: 'none'

version: 0.3.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Deep linking for lmyc:// custom URL scheme (QR code pairing)
  app_links: ^6.3.3
  # BLE scan + GATT connect to the boat terminal
  flutter_blue_plus: ^1.35.3
  # Runtime permissions (Bluetooth, location on older Android)
  permission_handler: ^11.3.1
  http: ^1.2.2
  image_picker: ^1.1.2
  image: ^4.3.0
  geolocator: ^13.0.2
  # In-app camera scan of the terminal pairing QR
  mobile_scanner: ^7.4.2
  # Remembers the last boat so the next launch rejoins it
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
