name: lmyc_app
description: LMYC Boat Terminal companion app — pairing, check-in, and boat tools for Lower Mainland Yacht Club members.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Deep linking for lmyc:// custom URL scheme (QR code pairing)
  app_links: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
