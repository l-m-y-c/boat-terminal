; LMYC Boat Terminal Firmware
; Target: Waveshare ESP32-S3-Touch-LCD-7 (7" 800x480 RGB, GT911 touch, ESP32-S3-N8R8)
; LVGL v8 foundation for cabin terminal UI (logbook, instruments, pairing screen)
; See docs/04-hardware.md, docs/14-prototype-hardware.md, and docs/03-system-architecture.md

[env:waveshare_esp32s3_touch_lcd_7]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Build and upload settings (match Waveshare wiki Arduino IDE recommendations)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I include
    ; Board-specific panel driver defines (ESP32_Display_Panel)
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7=1
    ; LVGL performance tweaks for RGB panel
    -DLV_COLOR_DEPTH=16
    -DLV_COLOR_16_SWAP=0
    ; Force C++17 for ESP32_Display_Panel (uses std::optional, std::variant, std::string_view, modern LCD driver)
    -std=gnu++17
    -D __cpp_lib_optional=201606L
    -D __cpp_lib_variant=201606L
    ; Define missing LCD_RGB_ELEMENT_ORDER_RGB (used in factory for this board)
    -DLCD_RGB_ELEMENT_ORDER_RGB=0
    -DLCD_RGB_ELEMENT_ORDER_BGR=1

build_unflags =
    -std=gnu++11
    -std=gnu++14

lib_deps =
    lvgl/lvgl@^8.3.11
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git
    https://github.com/esp-arduino-libs/esp-lib-utils.git

; Deep dependency scanning for the complex panel + LVGL port
lib_ldf_mode = deep+
