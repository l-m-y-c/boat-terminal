; LMYC Boat Terminal Firmware
; Target: Waveshare ESP32-S3-Touch-LCD-7 (7" 800x480 RGB, GT911 touch)
; Based on ESP32_Display_Panel official PlatformIO LVGL v8 port (Arduino 3.x).

[platformio]
default_envs = waveshare_esp32s3_touch_lcd_7
boards_dir = boards

[env:waveshare_esp32s3_touch_lcd_7]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
    tool-esptoolpy@file:///Users/jback/.platformio/packages/tool-esptoolpy-4.8.5

board = BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0
    -I src
    -std=gnu++17

build_unflags =
    -std=gnu++11
    -std=gnu++14

lib_deps =
    lvgl/lvgl@8.4.0
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    h2zero/NimBLE-Arduino@^1.4.3

lib_ldf_mode = deep+
